# Supply-chain hardening. See https://pnpm.io/supply-chain-security
# Only install versions that have been public for at least 7 days.
minimumReleaseAge: 10080
# Fail when a package loses provenance/trusted-publisher status compared to earlier versions.
trustPolicy: no-downgrade
# Transitive dependencies may not pull from git repositories or tarball URLs.
blockExoticSubdeps: true
# Unapproved lifecycle scripts fail the install instead of only warning.
strictDepBuilds: true
# Pin exact versions when adding dependencies.
savePrefix: ""
engineStrict: true
allowBuilds:
  esbuild: true
  # Cloudflare Workers runtime binary used by wrangler.
  workerd: true
trustPolicyExclude:
  # Published years before semver@7 adopted provenance; flagged as a downgrade by design.
  - semver@6.3.1
